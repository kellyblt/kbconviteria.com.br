  function travarFim(){
    if(!video) return;
    try{
      video.pause();
      if(isFinite(video.duration)&&video.duration>0){
        video.currentTime=Math.max(0,video.duration-0.05);
      }
    }catch(e){}
    if(watcher){ clearInterval(watcher); watcher=null; }
    liberarBotoes();
  }
  function acompanharTempo(){
    if(!jaTocou) return;
    if(video.currentTime>=PREFIXO) revelarVideo();
    if(FIM_CONTEUDO!==null&&video.currentTime>=FIM_CONTEUDO) liberarBotoes();
  }
  function acompanharFrame(){
    acompanharTempo();
    if(!video.paused&&!video.ended) frame=requestAnimationFrame(acompanharFrame); else frame=0;
  }
  function iniciarFrames(){ if(!frame) frame=requestAnimationFrame(acompanharFrame); }

  function reproduzir(){
    /* play() imediato, dentro do gesto: sem await, fetch ou temporizador antes. */
    if(!video||document.hidden) return;
    querTocar=true; pausouEmFundo=false;
    if(video.error) video.load();
    if(video.ended) return;
    video.muted=false;
    var id=++tentativa;
    avisarCarregamento();
    var promise;
    try{ promise=video.play(); }catch(erro){ tratarErro(erro,id); return; }
    if(promise&&typeof promise.then==='function'){
      promise.then(function(){
        if(id!==tentativa) return;
        jaTocou=true; limparAvisoCarregamento(); esconderRetomar(); mensagem(''); acompanharTempo(); iniciarFrames();
      }).catch(function(erro){ tratarErro(erro,id); });
    }
  }
  function tratarErro(erro,id){
    if(id!==tentativa||document.hidden) return;
    limparAvisoCarregamento();
    if(erro&&erro.name==='AbortError'){ mostrarRetomar('Toque para retomar o convite'); return; }
    mostrarRetomar('Toque para reproduzir com som');
    if(erro&&erro.name==='NotAllowedError') mensagem('O navegador pede um toque para autorizar o som.');
    else mensagem('Não foi possível iniciar. Toque para tentar novamente.');
  }
  window.__C2_TOCAR__=reproduzir;
  window.__C2_LIGAR_VIDEO__=reproduzir;
  window.__C2_LIBERAR__=liberarBotoes;
  window.__C2_RETOMAR__=function(){ mostrarRetomar('Toque para retomar o convite'); };

  if(video){
    video.addEventListener('playing',function(){ jaTocou=true; limparAvisoCarregamento(); esconderRetomar(); mensagem(''); acompanharTempo(); iniciarFrames(); });
    video.addEventListener('timeupdate',acompanharTempo);
    video.addEventListener('waiting',function(){ if(querTocar) avisarCarregamento(); });
    video.addEventListener('stalled',function(){ if(querTocar) avisarCarregamento(); });
    video.addEventListener('error',function(){ limparAvisoCarregamento(); mensagem('Não foi possível carregar o vídeo. Verifique a conexão ou recarregue a página.'); mostrarRetomar('Tentar carregar novamente'); });
    video.addEventListener('pause',function(){
      cancelAnimationFrame(frame); frame=0;
      if(querTocar&&!document.hidden&&!video.ended&&!pausouEmFundo&&!liberadoFinal()) mostrarRetomar('Toque para retomar o convite');
    });
    video.addEventListener('ended',function(){
      acompanharTempo();
      travarFim();
    });
  }
  function liberadoFinal(){ return liberado&&isFinite(video.duration)&&video.currentTime>=video.duration-0.2; }

  if(fallback) fallback.addEventListener('click',function(){ reproduzir(); });

  document.addEventListener('visibilitychange',function(){
    if(!video) return;
    if(document.hidden){ pausouEmFundo=querTocar&&!video.paused; ++tentativa; limparAvisoCarregamento(); video.pause(); }
    else if(querTocar&&video.paused&&!liberadoFinal()){ pausouEmFundo=false; mostrarRetomar('Toque para retomar o convite'); mensagem(''); }
  });
  window.addEventListener('pagehide',function(){ if(!video) return; ++tentativa; limparAvisoCarregamento(); video.pause(); });
  window.addEventListener('pageshow',function(e){ if(e.persisted&&querTocar&&video&&video.paused&&!liberadoFinal()) mostrarRetomar('Toque para retomar o convite'); });

<script>
/* ===== INTEGRAÇÃO COM CONTAINER 1 (raspadinha) =====
   O vídeo NÃO toca durante a raspagem: o que aparece pelos furos da película é a capa.
   No 1º toque o vídeo é pré-ligado dentro do gesto (autoriza o som) e volta ao 0.
   Quando a película some, a capa faz um fade suave e só então o vídeo começa. */
(function(){
  var wrap=document.getElementById('container2-video'),video=document.getElementById('video2');
  if(!wrap||!video)return;
  var ligado=false,preparado=false,preparando=null,revelado=false,quadroPendente=false,tentandoSom=false;

  /* Pré-ligação no gesto: toca um instante para autorizar o som e volta ao início, pausado. */
  window.__C2_PREPARAR_VIDEO__=function(){
    if(ligado||preparado||preparando)return;
    video.muted=false;
    try{
      preparando=Promise.resolve(video.play());
      preparando.then(function(){preparado=true;if(!ligado){video.pause();video.currentTime=0}}).catch(function(){}).finally(function(){preparando=null});
    }catch(e){preparando=null}
  };

  function iniciarFade(){
    if(revelado||!ligado||video.paused||video.readyState<2)return;
    revelado=true;
    wrap.classList.add('ativo');wrap.style.opacity='1';wrap.style.pointerEvents='auto';
    document.body.classList.add('rasp-fim');
    window.__talicodexIntroStarted=true;window.dispatchEvent(new Event('talicodex:intro-started'));
  }
  function esperarPrimeiroQuadro(){
    if(!ligado||revelado||quadroPendente||video.paused)return;
    quadroPendente=true;
    if(typeof video.requestVideoFrameCallback==='function'){
      video.requestVideoFrameCallback(function(){quadroPendente=false;iniciarFade()});
    }else{
      requestAnimationFrame(function(){requestAnimationFrame(function(){quadroPendente=false;iniciarFade()})});
    }
  }
  if(video){video.addEventListener('playing',esperarPrimeiroQuadro);video.addEventListener('loadeddata',esperarPrimeiroQuadro)}

  /* Chamado pelo Container 1 quando a película sumiu: o vídeo começa do início, com som. */
  window.__C2_LIGAR_VIDEO__=function(){
    if(ligado)return;ligado=true;
    try{
      video.muted=false;video.currentTime=0;
      var p=video.play();
      if(p&&p.catch)p.catch(function(){video.muted=true;var q=video.play();if(q&&q.catch)q.catch(function(){})});
    }catch(e){video.muted=true;try{video.play()}catch(_){}}
    esperarPrimeiroQuadro();
    /* Nunca fica preso: sem o vídeo rodar, os botões liberam 3,5 s depois. */
    setTimeout(function(){if(!revelado&&typeof window.__C2_LIBERAR__==='function')window.__C2_LIBERAR__()},3500);
  };
  window.mostrarContainer2=window.__C2_LIGAR_VIDEO__;
  window.__taliStartVideo=window.__C2_LIGAR_VIDEO__;

  /* Um próximo gesto devolve o som se o celular tiver bloqueado na pré-ligação. */
  function tentarSom(){
    if(tentandoSom||!ligado||video.ended||!video.muted)return;
    tentandoSom=true;video.muted=false;
    Promise.resolve(video.play()).catch(function(){video.muted=true;return video.play()}).catch(function(){}).finally(function(){tentandoSom=false});
  }
  ['touchend','pointerup','click'].forEach(function(t){document.addEventListener(t,tentarSom,true)});
})();
</script>

<script>
(function(){
  var musica=document.getElementById('musicaFundo');
  if(!musica) return;
  var VOLUME=0.4, quer=false, fade=0;
  function subir(){
    clearInterval(fade); musica.volume=0;
    fade=setInterval(function(){ musica.volume=Math.min(VOLUME,musica.volume+0.05); if(musica.volume>=VOLUME) clearInterval(fade); },80);
  }
  var pedida=false;
  function tocar(){
    pedida=true;
    if(document.hidden) return;
    var p; try{ p=musica.play(); }catch(_){ return; }
    if(p&&p.then) p.then(function(){ if(!quer){ quer=true; subir(); } }).catch(function(){});
    else quer=true;
  }
  window.__MUSICA_TOCAR__=tocar;
  /* Se o celular bloquear o 1º play, qualquer toque seguinte liga a música */
  ['touchend','pointerup','click'].forEach(function(t){
    document.addEventListener(t,function(){ if(pedida&&musica.paused&&!document.hidden) tocar(); },true);
  });
  /* Pausa quando sai do app e volta a tocar ao retornar */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ musica.pause(); }
    else if(pedida){ tocar(); }
  });
  window.addEventListener('pagehide',function(){ musica.pause(); });
})();
</script>
